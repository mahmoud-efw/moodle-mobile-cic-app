# First-build validation for the Concord rebrand on moodleapp v5.2.1.
# Debug build — NO signing secrets required. Proves the app compiles and a
# Cordova Android build produces an artifact. The signed release workflow is
# android-release.yml (needs the real upload keystore in secrets).
name: Android Build Check

on:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # needed to publish the APK as a Release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Add Android platform (idempotent)
        run: npx ionic cordova platform add android --no-interactive || true

      - name: Build DEBUG apk (unsigned, validation only)
        run: npx ionic cordova build android --no-interactive

      - name: Rename apk for a clear download name
        run: |
          set -e
          APK=$(find platforms/android/app/build/outputs -name '*.apk' | head -1)
          cp "$APK" "CIC-debug.apk"
          ls -la CIC-debug.apk

      - name: Upload debug apk (Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concord-debug-apk
          path: CIC-debug.apk
          if-no-files-found: warn

      - name: Publish debug APK to a Release (easy phone download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: CIC debug build (latest)
          body: >
            Latest unsigned DEBUG build of the CIC app for on-device testing.
            Uninstall any existing CIC app first (debug signature differs), then
            install CIC-debug.apk. Not for Play upload.
          prerelease: true
          files: CIC-debug.apk
