# codemagic.yaml — Concord International College iOS build (cloud Mac)
# Place this file at the ROOT of the app repo (next to package.json / config.xml).
#
# Values marked  # TODO:  are filled in once we read the legacy moodle.config.json.
# Codemagic does the signing + TestFlight upload for you — no local Mac needed.
#
# One-time setup in the Codemagic UI (see the runbook):
#   • Teams → Integrations → App Store Connect → add an API key  → name it "ConcordASC"
#   • That single integration handles code signing AND the TestFlight upload.

workflows:
  ios-release:
    name: Concord iOS Release
    instance_type: mac_mini_m2         # Codemagic's cloud Mac
    max_build_duration: 90

    integrations:
      app_store_connect: ConcordASC    # must match the integration name you create

    environment:
      groups:
        - ios_signing                   # Codemagic env-var group that holds the secure
                                        # var CERTIFICATE_PRIVATE_KEY (the reusable signing
                                        # key). The var MUST be added to a group of this
                                        # exact name in the Codemagic UI, or it won't be
                                        # injected into the build.
      node: 22                          # moodleapp v5.2.1 needs Node 22.x (engines >=22.17 <23)
      # Xcode 26 (iOS 26 SDK) is REQUIRED by App Store Connect as of 2026 — an
      # iOS 18 SDK build is rejected at upload ("must be built with the iOS 26 SDK
      # or later"). The older-ObjC ScanDependencies crash that 26.x otherwise hits
      # is handled by disabling Explicitly Built Modules in the archive step below
      # (CLANG_ENABLE_EXPLICIT_MODULES=NO), so 26.x now builds this codebase.
      xcode: 26.6
      cocoapods: default
      vars:
        XCODE_SCHEME: "CIC"                             # matches config.xml <name>CIC</name> (Cordova names the .xcworkspace/scheme after it)
        BUNDLE_ID: "com.egyptforweb.cic"                # CURRENT App Store bundle id — do NOT change (keeps it the same app)
        APP_STORE_APPLE_ID: 1615314269                  # numeric Apple ID of the Concord App Store listing

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Add iOS platform (idempotent)
        script: npx ionic cordova platform add ios --no-interactive || true

      # Build the web bundle in CORDOVA MODE and copy it into the iOS project.
      # This MUST go through `ionic cordova prepare` (the @ionic/cordova-builders
      # cordova-build builder), not a plain `ionic build`: only the cordova builder
      # rewrites <base href> from "/" to "./" and injects cordova.js so assets load
      # from file:// inside the WKWebView on-device. A plain `ionic build --prod`
      # leaves base href "/", which boots fine in a browser but hangs on the splash
      # screen on a real device (Angular never loads its root-absolute assets).
      # `prepare` builds the web + copies into the platform WITHOUT archiving, so
      # `xcode-project build-ipa` still does the one and only signed archive.
      - name: Build web (Cordova mode) + prepare iOS
        script: npx ionic cordova prepare ios --prod --no-interactive

      # Must run AFTER `cordova prepare` — prepare rewrites the Xcode project's
      # signing settings, so fetching/applying profiles has to come last.
      #
      # We fetch WITH --create so App Store Connect generates a distribution
      # profile that reflects the App ID's current capabilities (moodleapp
      # enables the Push Notifications entitlement, so the profile must carry
      # the Push Notifications feature — a bare `use-profiles` picked a profile
      # that lacked it). The distribution certificate is loaded into the
      # keychain, then `use-profiles` wires the fetched profiles into the
      # Xcode project. Requires the ConcordASC API key to have Admin or
      # App Manager role so it can create certs/profiles.
      # Code signing uses a STABLE private key stored once in Codemagic as the
      # secure env var CERTIFICATE_PRIVATE_KEY (raw PEM). fetch-signing-files then:
      #   - first ever build: creates ONE distribution certificate bound to that key
      #   - every later build: finds that same certificate (its key matches) and
      #     reuses it — no new cert, so Apple's certificate limit is never hit.
      # This replaces the old "create a fresh cert each build" approach, which
      # multiplied certs until Apple returned 409 "you already have a current iOS
      # Distribution certificate". --create still (re)generates the App Store
      # provisioning profile, which carries the App ID's Push Notifications feature.
      - name: Fetch signing files from App Store Connect
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Assemble signed IPA
        script: |
          WS=$(find "$CM_BUILD_DIR/platforms/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          # Run the build; capture its exit code without aborting so we can surface
          # the real xcodebuild error (build-ipa's pretty-printer hides it, leaving
          # only "Failed to archive").
          set +e
          # Force the archive to target iOS. Without an explicit destination,
          # xcodebuild picks a default, and because the Cordova-generated CIC target
          # advertises Mac among its supported destinations it archived for macOS —
          # then the iOS provisioning profile (correctly) didn't match "macOS".
          # --archive-flags: force the iOS destination (Cordova target also lists Mac).
          # --archive-xcargs: keep Codemagic's default (COMPILER_INDEX_STORE_ENABLE=NO)
          #   AND disable Xcode 16's "Explicitly Built Modules" (the ScanDependencies
          #   phase), which fails on the older Objective-C Cordova plugins
          #   (advanced-http, phonegap-plugin-push). Modules themselves stay enabled;
          #   only the explicit prebuild-scan mechanism is turned off.
          xcode-project build-ipa \
            --workspace "$WS" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination generic/platform=iOS" \
            --archive-xcargs="COMPILER_INDEX_STORE_ENABLE=NO CLANG_ENABLE_EXPLICIT_MODULES=NO SWIFT_ENABLE_EXPLICIT_MODULES=NO"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              echo "--------------------- last 40 lines of raw log ------------"
              tail -40 "$LOG"
              echo "=============== ERROR LINES (read these) ==================="
              # Printed LAST so it survives a truncated 'last 50 lines' paste.
              grep -nE "error:|fatal error|clang: error|ld: |Undefined symb|Provisioning|entitlement" "$LOG" | tail -40
              echo "log file: $LOG"
            else
              echo "no /tmp/xcodebuild_logs/*.log found"
            fi
            echo "============================================================"
            exit "$RC"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true      # lands in TestFlight automatically
        # submit_to_app_store: false    # flip to true only when you're ready for a public release
      email:
        recipients:
          - mahmoud.msa@gmail.com       # build result notifications
        notify:
          success: true
          failure: true
