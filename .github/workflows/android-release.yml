# Android signed-AAB build for the Concord app.
# Place at:  .github/workflows/android-release.yml  in the app repo.
#
# Repo → Settings → Secrets and variables → Actions → add these 4 secrets:
#   ANDROID_KEYSTORE_BASE64   (run:  base64 -w0 concord.keystore   on the keystore file)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional (for auto-publish to Play internal track):
#   PLAY_SERVICE_ACCOUNT_JSON

name: Android Release

on:
  workflow_dispatch:            # run manually from the Actions tab
  push:
    tags: ["v*"]               # or automatically on a version tag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to publish the .aab as a Release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17       # moodleapp Android build uses JDK 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/concord.keystore"

      - name: Add Android platform (idempotent)
        run: npx ionic cordova platform add android --no-interactive || true

      # Sign via a Cordova build.json (buildConfig), NOT via `-- --keystore` CLI
      # flags. The CLI flags are not reliably applied to an app BUNDLE, producing
      # an unsigned .aab that Google Play rejects ("All uploaded bundles must be
      # signed"). build.json wires the keystore into Gradle's release signingConfig,
      # so the .aab is properly signed. Secrets are passed via env (kept out of the
      # command line and logs) and written to a file outside the repo.
      - name: Build signed release bundle (.aab)
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync(process.env.RUNNER_TEMP+'/build.json',JSON.stringify({android:{release:{keystore:process.env.RUNNER_TEMP+'/concord.keystore',storePassword:process.env.KS_PASSWORD,alias:process.env.KEY_ALIAS,password:process.env.KEY_PASSWORD}}}));"
          npx ionic cordova build android --release --prod -- \
            --packageType=bundle \
            --buildConfig="$RUNNER_TEMP/build.json"

      - name: Verify the .aab is signed (fail early if not)
        run: |
          set -e
          AAB=$(find platforms/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "bundle: $AAB"
          # A signed bundle contains a META-INF signature block (.RSA/.EC/.SF).
          if unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "OK: bundle is signed."
          else
            echo "ERROR: bundle is NOT signed."; unzip -l "$AAB" | grep META-INF || true
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: concord-release-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish signed .aab to a Release (easy download for Play upload)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: CIC signed release bundle (latest)
          body: >
            Latest SIGNED release .aab for Google Play upload. Upload this file to
            Play Console -> Production. Not installable directly (App Bundle).
          prerelease: true
          files: platforms/android/app/build/outputs/bundle/release/*.aab

      # --- Optional: auto-publish to Play internal testing track ---
      # - name: Publish to Play (internal)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.egyptforweb.cic            # CURRENT Play package name — do NOT change
      #     releaseFiles: platforms/android/app/build/outputs/bundle/release/*.aab
      #     track: internal
