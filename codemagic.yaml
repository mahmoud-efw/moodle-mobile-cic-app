# codemagic.yaml — Concord International College iOS build (cloud Mac)
# Place this file at the ROOT of the app repo (next to package.json / config.xml).
#
# Values marked  # TODO:  are filled in once we read the legacy moodle.config.json.
# Codemagic does the signing + TestFlight upload for you — no local Mac needed.
#
# One-time setup in the Codemagic UI (see the runbook):
#   • Teams → Integrations → App Store Connect → add an API key  → name it "ConcordASC"
#   • That single integration handles code signing AND the TestFlight upload.

workflows:
  ios-release:
    name: Concord iOS Release
    instance_type: mac_mini_m2         # Codemagic's cloud Mac
    max_build_duration: 90

    integrations:
      app_store_connect: ConcordASC    # must match the integration name you create

    environment:
      node: 22                          # moodleapp v5.2.1 needs Node 22.x (engines >=22.17 <23)
      # Pin a stable Xcode 16 instead of `latest` (Xcode 26.x): the bleeding-edge
      # 26.x "Explicitly Built Modules" scanner (ScanDependencies) fails on the
      # older Objective-C in cordova-plugin-advanced-http (SM_AFNetworkReachabilityManager.m).
      # Moodle builds/releases moodleapp on Xcode 16.x, and Xcode 16 (iOS 18 SDK)
      # is what Apple currently requires for App Store submission, so this is both
      # known-good for this codebase and store-acceptable.
      xcode: 16.4
      cocoapods: default
      vars:
        XCODE_SCHEME: "CIC"                             # matches config.xml <name>CIC</name> (Cordova names the .xcworkspace/scheme after it)
        BUNDLE_ID: "com.egyptforweb.cic"                # CURRENT App Store bundle id — do NOT change (keeps it the same app)
        APP_STORE_APPLE_ID: 1615314269                  # numeric Apple ID of the Concord App Store listing

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Add iOS platform (idempotent)
        script: npx ionic cordova platform add ios --no-interactive || true

      # Build the Angular/Ionic web bundle only (gulp + `ionic build --prod` -> www/).
      # We deliberately do NOT run `cordova build ios --device`: that runs
      # `xcodebuild archive` itself, which always demands a development team, and its
      # `prepare` phase overwrites the signing settings. Instead we build the web,
      # copy it into the native project with `cordova prepare` (no archive), then let
      # `xcode-project build-ipa` do the one and only signed archive.
      - name: Build web assets (Angular/Ionic)
        script: npm run build:prod

      - name: Prepare Cordova iOS project (copy web assets, no archive)
        script: npx cordova prepare ios --no-interactive

      # Must run AFTER `cordova prepare` — prepare rewrites the Xcode project's
      # signing settings, so fetching/applying profiles has to come last.
      #
      # We fetch WITH --create so App Store Connect generates a distribution
      # profile that reflects the App ID's current capabilities (moodleapp
      # enables the Push Notifications entitlement, so the profile must carry
      # the Push Notifications feature — a bare `use-profiles` picked a profile
      # that lacked it). The distribution certificate is loaded into the
      # keychain, then `use-profiles` wires the fetched profiles into the
      # Xcode project. Requires the ConcordASC API key to have Admin or
      # App Manager role so it can create certs/profiles.
      # Code signing uses a STABLE private key stored once in Codemagic as the
      # secure env var CERTIFICATE_PRIVATE_KEY (raw PEM). fetch-signing-files then:
      #   - first ever build: creates ONE distribution certificate bound to that key
      #   - every later build: finds that same certificate (its key matches) and
      #     reuses it — no new cert, so Apple's certificate limit is never hit.
      # This replaces the old "create a fresh cert each build" approach, which
      # multiplied certs until Apple returned 409 "you already have a current iOS
      # Distribution certificate". --create still (re)generates the App Store
      # provisioning profile, which carries the App ID's Push Notifications feature.
      - name: Fetch signing files from App Store Connect
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Assemble signed IPA
        script: |
          WS=$(find "$CM_BUILD_DIR/platforms/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          # Run the build; capture its exit code without aborting so we can surface
          # the real xcodebuild error (build-ipa's pretty-printer hides it, leaving
          # only "Failed to archive").
          set +e
          xcode-project build-ipa --workspace "$WS" --scheme "$XCODE_SCHEME"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "=================== RAW XCODEBUILD ERRORS ==================="
            # codemagic-cli-tools writes the full raw xcodebuild output here.
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              echo "log: $LOG"
              grep -nE "error:|fatal error|clang: error|ld: |Provisioning|profile|entitlement|requires|No such|not found" "$LOG" | tail -80
              echo "--------------------- last 60 lines ------------------------"
              tail -60 "$LOG"
            else
              echo "no /tmp/xcodebuild_logs/*.log found"
            fi
            echo "============================================================"
            exit "$RC"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true      # lands in TestFlight automatically
        # submit_to_app_store: false    # flip to true only when you're ready for a public release
      email:
        recipients:
          - mahmoud.msa@gmail.com       # build result notifications
        notify:
          success: true
          failure: true
